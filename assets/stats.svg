<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Merged pull requests by Sboonny</title>
  <desc id="desc">560 merged pull requests on GitHub; 373 to freeCodeCamp/freeCodeCamp in 2022–2023; 144 to freeCodeCamp/chapter; 15 to freeCodeCamp's new Fastify API; 9 to t3-oss/create-t3-app. Source: GitHub search of merged pull requests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#0f2742"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .card { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .c1 { animation-delay: .05s; } .c2 { animation-delay: .2s; } .c3 { animation-delay: .35s; }
    .c4 { animation-delay: .5s; } .c5 { animation-delay: .65s; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .grow { transform: scaleX(0); transform-origin: left; transform-box: fill-box; animation: grow 1.1s .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .card { opacity: 1; animation: none; }
      .grow { transform: none; animation: none; }
    }
  </style>

  <rect width="1200" height="230" rx="20" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="229" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g class="sans">
    <text x="40" y="46" font-size="18" font-weight="700" fill="#f1f5f9">Open-source output</text>
    <text class="mono" x="1160" y="46" text-anchor="end" font-size="12" fill="#94a3b8">merged pull requests · source: GitHub search</text>

    <!-- 5 cards: x = 40 + i*228, width 208 -->
    <g transform="translate(40 70)"><g class="card c1">
      <rect width="208" height="130" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="20" y="56" font-size="44" font-weight="700" fill="#f8fafc">560</text>
      <text x="20" y="84" font-size="14" fill="#cbd5e1">merged PRs on GitHub</text>
      <rect class="grow" x="20" y="104" width="168" height="4" rx="2" fill="url(#bar)"/>
    </g>
    </g>
    <g transform="translate(268 70)"><g class="card c2">
      <rect width="208" height="130" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="20" y="56" font-size="44" font-weight="700" fill="#f8fafc">373</text>
      <text x="20" y="84" font-size="14" fill="#cbd5e1">freeCodeCamp, 2022–23</text>
      <rect class="grow" x="20" y="104" width="112" height="4" rx="2" fill="url(#bar)"/>
    </g>
    </g>
    <g transform="translate(496 70)"><g class="card c3">
      <rect width="208" height="130" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="20" y="56" font-size="44" font-weight="700" fill="#f8fafc">144</text>
      <text x="20" y="84" font-size="14" fill="#cbd5e1">freeCodeCamp/chapter</text>
      <rect class="grow" x="20" y="104" width="43" height="4" rx="2" fill="url(#bar)"/>
    </g>
    </g>
    <g transform="translate(724 70)"><g class="card c4">
      <rect width="208" height="130" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="20" y="56" font-size="44" font-weight="700" fill="#f8fafc">15</text>
      <text x="20" y="84" font-size="14" fill="#cbd5e1">new Fastify API</text>
      <rect class="grow" x="20" y="104" width="6" height="4" rx="2" fill="url(#bar)"/>
    </g>
    </g>
    <g transform="translate(952 70)"><g class="card c5">
      <rect width="208" height="130" rx="14" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="20" y="56" font-size="44" font-weight="700" fill="#f8fafc">9</text>
      <text x="20" y="84" font-size="14" fill="#cbd5e1">t3-oss/create-t3-app</text>
      <rect class="grow" x="20" y="104" width="4" height="4" rx="2" fill="url(#bar)"/>
    </g>
    </g>
  </g>
</svg>
